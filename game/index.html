  <script>
    // Офлайн-режим для браузерной версии на GitHub Pages; на file:// и в APK не нужен.
    // localhost разрешён, чтобы проверять service worker локально.
    var swHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || swHost)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
